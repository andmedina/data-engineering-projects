<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Manufacturing Intelligence Platform architecture</title>
  <desc id="desc">Simulated ERP, MES, quality, maintenance, and sensor systems flow through Python synthetic ETL into PostgreSQL, then feed analytics, Tableau dashboards, and predictive maintenance models.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#59c3e8"/>
    </marker>
    <style>
      .heading { fill: #f8fafc; font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #7dd3fc; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .box-title { fill: #f8fafc; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box-copy { fill: #cbd5e1; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small-title { fill: #f8fafc; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small-copy { fill: #cbd5e1; font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .connector { fill: none; stroke: #59c3e8; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#background)"/>
  <text x="600" y="48" text-anchor="middle" class="heading">Manufacturing Intelligence Platform</text>
  <text x="600" y="76" text-anchor="middle" class="eyebrow">END-TO-END DATA ARCHITECTURE</text>

  <!-- Simulated source systems -->
  <text x="70" y="120" class="eyebrow">SIMULATED OPERATIONAL SOURCES</text>
  <g>
    <rect x="70" y="140" width="190" height="105" rx="14" fill="#1e3a5f" stroke="#3b82a8"/>
    <rect x="285" y="140" width="190" height="105" rx="14" fill="#1e3a5f" stroke="#3b82a8"/>
    <rect x="500" y="140" width="190" height="105" rx="14" fill="#1e3a5f" stroke="#3b82a8"/>
    <rect x="715" y="140" width="190" height="105" rx="14" fill="#1e3a5f" stroke="#3b82a8"/>
    <rect x="930" y="140" width="200" height="105" rx="14" fill="#1e3a5f" stroke="#3b82a8"/>
  </g>
  <text x="165" y="174" text-anchor="middle" class="box-title">ERP &amp; Inventory</text>
  <text x="165" y="199" text-anchor="middle" class="box-copy">orders • products • materials</text>
  <text x="165" y="220" text-anchor="middle" class="box-copy">customers • suppliers • lots</text>
  <text x="380" y="174" text-anchor="middle" class="box-title">MES</text>
  <text x="380" y="199" text-anchor="middle" class="box-copy">production orders • runs</text>
  <text x="380" y="220" text-anchor="middle" class="box-copy">machines • operators</text>
  <text x="595" y="174" text-anchor="middle" class="box-title">Quality</text>
  <text x="595" y="199" text-anchor="middle" class="box-copy">inspections • defects</text>
  <text x="595" y="220" text-anchor="middle" class="box-copy">dispositions • severity</text>
  <text x="810" y="174" text-anchor="middle" class="box-title">Maintenance</text>
  <text x="810" y="199" text-anchor="middle" class="box-copy">downtime events</text>
  <text x="810" y="220" text-anchor="middle" class="box-copy">maintenance history</text>
  <text x="1030" y="174" text-anchor="middle" class="box-title">Industrial IoT</text>
  <text x="1030" y="199" text-anchor="middle" class="box-copy">five-minute sensor readings</text>
  <text x="1030" y="220" text-anchor="middle" class="box-copy">temperature • vibration • RPM</text>

  <!-- Source bus into ETL -->
  <path d="M165 245 V275 M380 245 V275 M595 245 V275 M810 245 V275 M1030 245 V275 M165 275 H1030 M600 275 V310" stroke="#59c3e8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ETL and database -->
  <g>
    <rect x="350" y="315" width="500" height="95" rx="16" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  </g>
  <text x="600" y="350" text-anchor="middle" class="box-title">Python Synthetic ETL Pipeline</text>
  <text x="600" y="376" text-anchor="middle" class="box-copy">Extract master data → generate transactions → validate business rules → load</text>
  <text x="600" y="396" text-anchor="middle" class="box-copy">SQLAlchemy Core • Pandas • Faker • pytest</text>
  <path d="M600 410 V450" class="connector"/>

  <g>
    <rect x="410" y="455" width="380" height="90" rx="45" fill="#334155" stroke="#7dd3fc" stroke-width="2"/>
  </g>
  <text x="600" y="493" text-anchor="middle" class="box-title">PostgreSQL Integrated Data Store</text>
  <text x="600" y="519" text-anchor="middle" class="box-copy">18 normalized tables • constraints • indexes • relational history</text>

  <!-- Consumption branches -->
  <path d="M600 545 V575 M600 575 H235 V605 M600 575 V605 M600 575 H965 V605" stroke="#59c3e8" stroke-width="2.5" fill="none"/>
  <path d="M235 575 V605 M600 575 V605 M965 575 V605" class="connector"/>

  <text x="70" y="595" class="eyebrow">ANALYTICAL OUTPUTS</text>
  <g>
    <rect x="70" y="610" width="330" height="80" rx="14" fill="#263b56" stroke="#64748b"/>
    <rect x="435" y="610" width="330" height="80" rx="14" fill="#263b56" stroke="#64748b"/>
    <rect x="800" y="610" width="330" height="80" rx="14" fill="#263b56" stroke="#64748b"/>
  </g>
  <text x="235" y="642" text-anchor="middle" class="small-title">SQL &amp; Python Analytics</text>
  <text x="235" y="665" text-anchor="middle" class="small-copy">FPY • scrap • rework • downtime • root cause</text>
  <text x="600" y="642" text-anchor="middle" class="small-title">Tableau Executive Dashboard</text>
  <text x="600" y="665" text-anchor="middle" class="small-copy">KPI cards • quality trends • machine performance</text>
  <text x="965" y="642" text-anchor="middle" class="small-title">Predictive Maintenance</text>
  <text x="965" y="665" text-anchor="middle" class="small-copy">scikit-learn • time-aware validation • failure risk</text>
</svg>
